name: release

# Two ways to release:
#   - Publish a release such as v1.2.3 in the GitHub UI (needed the first time,
#     to tick "Publish this Action to the GitHub Marketplace").
#   - Run this workflow by hand with a version: it creates the tag and the
#     release on the commit it runs on.
# Either way, the major tag (v1) then points at the new release, so
# `uses: Guilherme-Benfica/setup-aws-emulator@v1` always gets the latest v1.x.y.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release and move the major tag
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versions must look like v1.2.3, got: ${TAG}"
            exit 1
          fi

      - name: Create the release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists."
            exit 1
          fi
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes

      - name: Point the major tag at this release
        run: |
          major="${TAG%%.*}"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
          echo "${major} now points at ${TAG} (${GITHUB_SHA})" >>"${GITHUB_STEP_SUMMARY}"
